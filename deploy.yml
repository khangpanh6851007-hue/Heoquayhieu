name: Deploy Heo Quay Hieu Web to GitHub Pages

on:
  # Tự động chạy khi push code lên nhánh main
  push:
    branches: ["main"]

  # Cho phép bấm chạy thủ công từ giao diện GitHub Actions (nếu cần)
  workflow_dispatch:

# Cấp quyền cho GitHub Actions có thể xuất bản lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ cho phép 1 luồng deploy chạy cùng một lúc
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Job 1: Triển khai ứng dụng
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # Thư mục gốc chứa file index.html (dấu '.' nghĩa là thư mục hiện tại)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
